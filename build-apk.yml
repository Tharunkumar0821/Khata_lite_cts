name: Build APK

# Builds an installable APK in the cloud, so you need nothing on your own
# machine except a way to push these files to GitHub.
#
# After it runs: Actions tab -> the finished run -> Artifacts -> khata-apk.
# Unzip it, copy app-debug.apk to the phone, tap it, allow the install.

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add the android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build the debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: khata-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# To build a signed release instead, put your keystore in the repo secrets
# (base64 of the .jks file plus the passwords), decode it in a step, and swap
# assembleDebug for assembleRelease with the signing values passed in as
# -Pandroid.injected.signing.* properties. The README explains the keystore.
